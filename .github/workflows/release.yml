name: Release

# Push a tag like v2.1.0 to publish a release. Installed copies of ThemeForge
# find it through the GitHub API and download themeforge.py + its checksum
# (Linux) or ThemeForge-Setup.exe + its checksum (Windows).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match VERSION in themeforge.py and the RPM spec
        run: |
          file_ver=$(grep -Po '^VERSION = "\K[^"]+' themeforge.py)
          spec_ver=$(sed -n 's/^Version:[[:space:]]*//p' packaging/themeforge.spec)
          tag_ver="${GITHUB_REF_NAME#v}"
          if [ "$file_ver" != "$tag_ver" ] || [ "$spec_ver" != "$tag_ver" ]; then
            echo "::error::tag is $GITHUB_REF_NAME but themeforge.py says $file_ver and the spec says $spec_ver"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          pip install -r requirements.txt pytest
          QT_QPA_PLATFORM=offscreen pytest -q tests

      - name: Checksum
        run: sha256sum themeforge.py > themeforge.py.sha256

      - name: Release notes from CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "ThemeForge $ver" > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: ThemeForge ${{ github.ref_name }}
          body_path: notes.md
          files: |
            themeforge.py
            themeforge.py.sha256
            install.sh

  windows:
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the app, the portable zip and the installer
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1
          if ($LASTEXITCODE) { throw "build failed" }
      - name: Self-test the built app
        run: |
          $p = Start-Process dist\ThemeForge\ThemeForge.exe -ArgumentList "--selftest", "$pwd\selftest-frozen.json" -Wait -PassThru
          python tools/selftest_report.py selftest-frozen.json
          if ($LASTEXITCODE) { throw "self-test failed" }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ThemeForge-Setup.exe
            dist/ThemeForge-Setup.exe.sha256
            dist/ThemeForge-Windows.zip
            dist/ThemeForge-Windows.zip.sha256
