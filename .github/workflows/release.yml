name: Release

# Push a tag like v2.1.0 to publish a release. Installed copies of ThemeForge
# find it through the GitHub API and download themeforge.py + its checksum.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match VERSION in themeforge.py
        run: |
          file_ver=$(grep -Po '^VERSION = "\K[^"]+' themeforge.py)
          tag_ver="${GITHUB_REF_NAME#v}"
          if [ "$file_ver" != "$tag_ver" ]; then
            echo "::error::themeforge.py says VERSION = \"$file_ver\" but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          pip install -r requirements.txt pytest
          QT_QPA_PLATFORM=offscreen pytest -q tests

      - name: Checksum
        run: sha256sum themeforge.py > themeforge.py.sha256

      - name: Release notes from CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "ThemeForge $ver" > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: ThemeForge ${{ github.ref_name }}
          body_path: notes.md
          files: |
            themeforge.py
            themeforge.py.sha256
            install.sh
