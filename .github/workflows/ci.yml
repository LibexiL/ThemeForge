name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries Qt needs
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -r requirements.txt pytest ruff
      - name: Lint
        run: ruff check --select F,E9 themeforge.py tests tools
      - name: Shell scripts
        run: bash -n install.sh && bash -n uninstall.sh
      - name: Community themes
        run: python3 tools/build_theme_index.py --check
      - name: Python 3.10 syntax
        run: ruff check --target-version py310 --select E9 themeforge.py tools tests
      - name: Desktop file
        run: sudo apt-get install -y desktop-file-utils && desktop-file-validate packaging/themeforge.desktop
      - name: Tests
        run: QT_QPA_PLATFORM=offscreen pytest -q tests

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-windows.txt pytest pyinstaller
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
      - name: Self-test from source
        if: always()
        env:
          THEMEFORGE_SELFTEST_PROCESSES: "1"
        run: python themeforge.py --selftest selftest-source.json
      - name: Build the app
        if: always()
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name ThemeForge `
            --icon packaging\windows\themeforge.ico `
            --collect-submodules winrt --hidden-import pyaudiowpatch themeforge.py
      - name: Self-test the built app
        if: always()
        env:
          THEMEFORGE_SELFTEST_PROCESSES: "1"
        run: |
          $p = Start-Process dist\ThemeForge\ThemeForge.exe -ArgumentList "--selftest", "$pwd\selftest-frozen.json" -Wait -PassThru
          "exit code $($p.ExitCode)"
      - name: Build the installer
        if: always()
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $ver = (Select-String -Path themeforge.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$ver" packaging\windows\themeforge.iss
          if ($LASTEXITCODE) { throw "Inno Setup failed" }
      - name: Install it and self-test the installed app
        if: always()
        run: |
          $p = Start-Process dist\ThemeForge-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          "installer exit code $($p.ExitCode)"
          Start-Sleep 3
          Get-Process ThemeForge -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = "$env:LOCALAPPDATA\Programs\ThemeForge\ThemeForge.exe"
          $p = Start-Process $exe -ArgumentList "--selftest", "$pwd\selftest-installed.json" -Wait -PassThru
          "exit code $($p.ExitCode)"
      - name: Report
        if: always()
        run: python tools/selftest_report.py selftest-source.json selftest-frozen.json selftest-installed.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: themeforge-windows
          path: |
            selftest-*.json
            dist/ThemeForge-Setup.exe
            dist/ThemeForge/**/*.log
