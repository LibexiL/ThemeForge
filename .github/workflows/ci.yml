name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries Qt needs
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -r requirements.txt pytest ruff
      - name: Lint
        run: ruff check --select F,E9 themeforge.py tests
      - name: Shell scripts
        run: bash -n install.sh && bash -n uninstall.sh
      - name: Tests
        run: QT_QPA_PLATFORM=offscreen pytest -q tests
